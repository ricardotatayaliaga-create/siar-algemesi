name: Datos SIAR Algemesí

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  consultar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests

      - name: Consultar SIAR
        env:
          SIAR_TOKEN: ${{ secrets.SIAR_TOKEN }}
        run: python siar.py

      - name: Comprobar archivo generado
        run: |
          echo "Archivos del repositorio:"
          ls -la
          echo "Contenido del CSV:"
          cat datos_algemesi.csv

      - name: Subir datos como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: datos-algemesi
          path: datos_algemesi.csv
