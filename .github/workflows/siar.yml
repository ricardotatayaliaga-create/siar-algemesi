name: Datos SIAR Algemesí

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  consultar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests

      - name: Consultar SIAR
        env:
          SIAR_TOKEN: ${{ secrets.SIAR_TOKEN }}
        run: python siar.py

      - name: Guardar datos históricos
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add datos_algemesi.csv
          git diff --cached --quiet || git commit -m "Actualizar datos meteorológicos"
          git push
